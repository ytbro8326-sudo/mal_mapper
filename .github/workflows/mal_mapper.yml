name: MAL ID Mapper

on:
  workflow_dispatch:
    inputs:
      input_json_url:
        description: >
          Raw GitHub URL to animegg_all_series1.json
          (leave blank to use the hardcoded default)
        required: false
        default: ""
      range_start:
        description: >
          Start index (1-based, inclusive).
          Leave blank to process from the beginning.
        required: false
        default: ""
      range_end:
        description: >
          End index (1-based, inclusive).
          Leave blank to process until the end.
        required: false
        default: ""

  schedule:
    - cron: "0 2 * * 0"

  push:
    paths:
      - "animegg_all_series1.json"

jobs:
  map-mal-ids:
    name: Map MAL IDs → 4 result files
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      # Override INPUT_JSON_URL only if manually supplied
      - name: Set INPUT_JSON_URL (if provided via dispatch)
        if: github.event.inputs.input_json_url != ''
        run: echo "INPUT_JSON_URL=${{ github.event.inputs.input_json_url }}" >> "$GITHUB_ENV"

      # Pass range values into the environment when provided
      - name: Set RANGE_START (if provided via dispatch)
        if: github.event.inputs.range_start != ''
        run: echo "RANGE_START=${{ github.event.inputs.range_start }}" >> "$GITHUB_ENV"

      - name: Set RANGE_END (if provided via dispatch)
        if: github.event.inputs.range_end != ''
        run: echo "RANGE_END=${{ github.event.inputs.range_end }}" >> "$GITHUB_ENV"

      - name: Run MAL mapper
        run: python mal_mapper.py

      - name: Commit result files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add results/exact_matching.json \
                  results/fuzzy_matching.json \
                  results/first_results_fallback.json \
                  results/not_matching.json

          if git diff --cached --quiet; then
            echo "No changes to commit — result files are identical."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")

            # Build a range label for the commit message
            RANGE_LABEL=""
            if [ -n "$RANGE_START" ] || [ -n "$RANGE_END" ]; then
              START_LABEL="${RANGE_START:-start}"
              END_LABEL="${RANGE_END:-end}"
              RANGE_LABEL=" [range ${START_LABEL}–${END_LABEL}]"
            fi

            git commit -m "chore: update MAL ID results${RANGE_LABEL} [${TIMESTAMP}]"
            git push
          fi
