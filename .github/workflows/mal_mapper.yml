name: MAL ID Mapper

on:
  workflow_dispatch:
    inputs:
      input_json_url:
        description: >
          Raw GitHub URL to animegg_all_series1.json
          (leave blank to use the hardcoded default)
        required: false
        default: ""

      force_reset:
        description: >
          Set to 'true' to wipe all previous progress and start from scratch.
        required: false
        default: "false"

  schedule:
    - cron: "0 2 * * 0"

  push:
    paths:
      - "animegg_all_series1.json"

jobs:
  map-mal-ids:
    name: Map MAL IDs → 4 result files
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      # Override INPUT_JSON_URL only if manually supplied via dispatch
      - name: Set INPUT_JSON_URL (if provided via dispatch)
        if: github.event.inputs.input_json_url != ''
        run: echo "INPUT_JSON_URL=${{ github.event.inputs.input_json_url }}" >> "$GITHUB_ENV"

      - name: Run MAL mapper
        run: |
          if [ "${{ github.event.inputs.force_reset }}" = "true" ]; then
            echo "🔄  force_reset=true — running with --force flag"
            python mal_mapper.py --force
          else
            python mal_mapper.py
          fi

      - name: Commit result files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage result files + the crash-safe progress files
          git add results/exact_matching.json \
                  results/fuzzy_matching.json \
                  results/first_results_fallback.json \
                  results/not_matching.json \
                  results/progress.jsonl \
                  results/.done 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit — result files are identical."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore: update MAL ID results [${TIMESTAMP}]"
            git push
          fi
